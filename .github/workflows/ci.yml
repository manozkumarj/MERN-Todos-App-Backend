name: Build Node Application

on: 
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Login to docker hub
      - name: Login to docker hub
        run: docker login -u ${{ env.DOCKER_USERNAME }} -p ${{ env.DOCKER_PASSWORD }}     

      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/mern-todos-app-backend:latest  .

      # Publish Image to docker hub
      - name: Publish Image to docker hub
        run: docker push ${{ env.DOCKER_USERNAME }}/mern-todos-app-backend:latest 